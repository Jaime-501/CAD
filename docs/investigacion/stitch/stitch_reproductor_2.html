<!-- BEGIN: Interactive Logic for Controls -->
<script data-purpose="player-interactivity">
    // Light interactive toggle for server chip active states
    document.addEventListener('DOMContentLoaded', () => {
      const serverButtons = document.querySelectorAll('[data-purpose="server-selection"] button');
      serverButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          // Visual state update example
          serverButtons.forEach(b => {
            if(b.closest('details') === null) {
              b.classList.remove('glass-chip-active', 'text-black', 'font-semibold');
              b.classList.add('glass-chip-inactive', 'text-slate-300', 'font-medium');
            }
          });
          if(btn.closest('details') === null) {
            btn.classList.remove('glass-chip-inactive', 'text-slate-300', 'font-medium');
            btn.classList.add('glass-chip-active', 'text-black', 'font-semibold');
          }
        });
      });
    });
  </script>
